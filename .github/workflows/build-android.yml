
name: YmcChat Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build YmcChat APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Installation du SDK Android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # 4. Installation des composants Android
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Configuration de Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6. Compilation de l'application
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      # 7. Vérification de l'APK
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "YmcChat APK successfully generated!"

      # 8. Publication de l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YmcChat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
